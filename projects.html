<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Projects</title>

<style>

  body {
  margin: 0;
  height: 100vh;
  background:
    radial-gradient(circle at 20% 20%, #1a1f2b 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, #111622 0%, transparent 40%),
    linear-gradient(135deg, #0a0f1c, #05070d);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
}

  body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

  .window {
    width: 80%;
    max-width: 1000px;
    background: rgba(20, 20, 30, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 30px;
    color: #fff;
    position: relative;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  }

  .content {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  .text {
    flex: 1;
  }

  .text h2 {
    margin: 0 0 10px;
    font-size: 28px;
    font-weight: bold;
  }

  .text p {
    line-height: 1.6;
    color: #ccc;
  }

  .image {
    flex: 1;
  }

  .image img {
    width: 100%;
    border-radius: 12px;
  }

  .arrow {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    cursor: pointer;
    user-select: none;
    color: #aaa;
  }

  .arrow:hover {
    color: #fff;
  }

  .left {
    left: -40px;
  }

  .right {
    right: -40px;
  }
</style>
</head>

<body>

<div class="window">
  <div class="arrow left" onclick="prev()">‹</div>
  <div class="arrow right" onclick="next()">›</div>

  <div class="content">
    <div class="text">
      <h2 id="title"></h2>
      <p id="desc"></p>
    </div>
    <div class="image">
      <img id="img" src="" alt="project image">
    </div>
  </div>
</div>

<script>
  const projects = [
    {
      title: "Project One",
      desc: "Short description of project one. What it is, what problem it solves.",
      img: "macos-catalina-mountains-island-night-stock-5k-6016x6016-189.jpg"
    },
    {
      title: "Project Two",
      desc: "Short description of project two. Focus on what you built.",
      img: "car-with-lights-driving-down-road.jpg"
    }
  ];

  let index = 0;

  function loadProject() {
    document.getElementById("title").innerText = projects[index].title;
    document.getElementById("desc").innerText = projects[index].desc;
    document.getElementById("img").src = projects[index].img;
  }

  function next() {
    index = (index + 1) % projects.length;
    loadProject();
  }

  function prev() {
    index = (index - 1 + projects.length) % projects.length;
    loadProject();
  }

  loadProject();
</script>

</body>
</html>
